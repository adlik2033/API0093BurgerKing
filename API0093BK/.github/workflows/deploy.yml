name: Build and deploy to MonsterASP.NET

on:
  push:
    branches: [ "master" ]  # Укажите вашу основную ветку

jobs:
  build_and_deploy:
    runs-on: windows-latest  # Для ASP.NET Core обязателен Windows-раннер
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0  # Укажите вашу версию .NET (6.0, 8.0, 9.0)

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish --runtime win-x86

      - name: Deploy to MonsterASP.NET
        uses: rasmusbuchholdt/simply-web-deploy@v2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}